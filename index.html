<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Painel Live - Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h2>DADOS EM TEMPO REAL E TRACKER</h2>
</header>

<div class="container">
    <div class="painel-mensagens">
        <div class="busca-container">
            <input type="text" id="busca-jogo" placeholder="🔍 Pesquisar time ou ID..." onkeyup="filtrarJogos()">
        </div>

        <div id="dados-tempo-real">
        </div>
    </div>

    <div class="painel-widget">
        <iframe id="widget-3d" title="Tracker 3D" src="https://widgets.thesports01.com/pt/3d/football?profile=7ph5yvyjwesjh0jv1804&uuid=vjxm8gh51o0xr6o"></iframe>
    </div>
</div>

<script>
    const painelDados = document.getElementById('dados-tempo-real');
    let socket;
    
    const dicionarioStatus = {
        1: "Não Iniciado",
        2: "1º Tempo",
        3: "Intervalo",
        4: "2º Tempo",
        5: "Prorrogação",
        7: "Pênaltis",
        8: "Encerrado"
    };

    function filtrarJogos() {
        const termo = document.getElementById('busca-jogo').value.toLowerCase();
        const itens = document.querySelectorAll('.lance');
        itens.forEach(item => {
            item.style.display = item.innerText.toLowerCase().includes(termo) ? "block" : "none";
        });
    }

    function carregarNoWidget(id) {
        document.getElementById('widget-3d').src = `https://widgets.thesports01.com/pt/3d/football?profile=7ph5yvyjwesjh0jv1804&uuid=${id}`;
    }

    // Agora recebe timeCasa e timeFora
    function atualizarCard(id, placar, statusTexto, corBadge, timeCasa, timeFora) {
        let div = document.getElementById(`jogo-${id}`);
        
        const conteudoCard = `
            <div class="item-jogo" onclick="carregarNoWidget('${id}')">
                <span class="badge" style="color:${corBadge}; font-size:11px; font-weight:bold; letter-spacing: 0.5px;">
                    ${statusTexto.toUpperCase()}
                </span>
                <strong class="times-nome" style="display:block; margin:6px 0; color:#f0f6fc;">
                    ${timeCasa} VS ${timeFora}
                </strong>
                <div class="placar-feed" style="font-size: 22px; font-weight: bold; color: #58a6ff;">
                    ${placar}
                </div>
                <span class="hint" style="font-size: 11px; color: #8b949e; display:block; margin-top:4px;">
                    ID: ${id.substring(0,8)}... | ANALISAR 3D
                </span>
            </div>
        `;

        if (!div) {
            div = document.createElement('div');
            div.id = `jogo-${id}`;
            div.className = 'lance';
            div.innerHTML = conteudoCard;
            painelDados.prepend(div);
        } else {
            div.innerHTML = conteudoCard;
        }
        filtrarJogos();
    }

    function conectarMotor() {
        // Sua URL do ngrok
    socket = new WebSocket('wss://desertic-vaughn-nonvirtuously.ngrok-free.dev');
      /* socket = new WebSocket('ws://localhost:8082'); */
        
        socket.onmessage = (event) => {
            try {
                const pacote = JSON.parse(event.data);

                if (pacote.tipo === 'REST_LIVE') {
                    pacote.dados.forEach(jogo => {
                        const id = jogo.id;
                        
                        let placarCasa = '0';
                        let placarFora = '0';
                        if (jogo.score && jogo.score[2] && jogo.score[2][0] !== undefined) placarCasa = jogo.score[2][0];
                        if (jogo.score && jogo.score[3] && jogo.score[3][0] !== undefined) placarFora = jogo.score[3][0];
                        const placar = `${placarCasa} x ${placarFora}`;
                        
                        const statusReal = (jogo.score && jogo.score[1]) ? jogo.score[1] : 0;
                        const statusTexto = dicionarioStatus[statusReal] || "AO VIVO";
                        const corBadge = statusReal === 8 ? "#ff5858" : "#58a6ff";

                        // Puxa os nomes que o servidor enviou (ou usa o padrão se não achar)
                        const timeCasa = jogo.timeCasa || "Time Casa";
                        const timeFora = jogo.timeFora || "Time Fora";

                        atualizarCard(id, placar, statusTexto, corBadge, timeCasa, timeFora);
                    });
                }
            } catch (e) { console.error("Erro no JSON", e); }
        };
        socket.onclose = () => setTimeout(conectarMotor, 3000);
    }
    
    conectarMotor();
</script>
</body>
</html>
