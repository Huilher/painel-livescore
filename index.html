<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel de Jogos ao Vivo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h2>DADOS EM TEMPO REAL E TRACKER</h2>
</header>

<div class="container">
    <div class="painel-mensagens">
        <h3>⚽ Feed de Lances e Estatísticas</h3>
        <div id="dados-tempo-real">
            </div>
    </div>

    <div class="painel-widget">
        <iframe 
            src="https://widgets.thesports01.com/pt/3d/football?profile=7ph5yvyjwesjh0jv1804&uuid=vjxm8gh51o0xr6o">
        </iframe>
    </div>
</div>

<script>
    const painelDados = document.getElementById('dados-tempo-real');
    let socket;
    const LIMITE_LINHAS = 50;
    const memoriaPlacar = {}; 

    function carregarNoWidget(idDoJogo) {
        const iframe = document.querySelector('.painel-widget iframe');
        iframe.src = `https://widgets.thesports01.com/pt/3d/football?profile=7ph5yvyjwesjh0jv1804&uuid=${idDoJogo}`;
        console.log("⚽ Detalhando partida:", idDoJogo);
    }

    function adicionarLinha(conteudoHtml) {
        const divLance = document.createElement('div');
        divLance.className = 'lance';
        divLance.innerHTML = conteudoHtml;
        painelDados.prepend(divLance);

        while (painelDados.children.length > LIMITE_LINHAS) {
            painelDados.removeChild(painelDados.lastChild);
        }
    }

    function conectarMotor() {
        socket = new WebSocket('wss://desertic-vaughn-nonvirtuously.ngrok-free.dev');

        socket.onopen = () => {
            adicionarLinha('<span style="color: #4caf50; font-weight: bold;">✅ MOTOR DE DADOS ONLINE</span>');
        };

        socket.onmessage = (event) => {
            try {
                const pacote = JSON.parse(event.data);

                if (pacote.tipo === 'REST_LIVE') {
                    pacote.dados.forEach(jogo => {
                        const id = jogo.id;
                        const casa = jogo.score?.[2]?.[0] ?? '0';
                        const fora = jogo.score?.[3]?.[0] ?? '0';
                        const placarAtual = `${casa} x ${fora}`;

                        if (!memoriaPlacar[id] || memoriaPlacar[id] !== placarAtual) {
                            
                            // Carrega o primeiro jogo automaticamente no início
                            if (Object.keys(memoriaPlacar).length === 0) {
                                carregarNoWidget(id);
                            }

                            memoriaPlacar[id] = placarAtual;

                            adicionarLinha(`
                                <div class="item-jogo" onclick="carregarNoWidget('${id}')">
                                    <div class="info">
                                        <span class="badge-ao-vivo">LIVE</span>
                                        <strong>PARTIDA ${id.substring(0,6)}</strong>
                                    </div>
                                    <div class="placar-feed">${placarAtual}</div>
                                    <span class="hint">ANALISAR 3D</span>
                                </div>
                            `);
                        }
                    });
                }

                if (pacote.tipo === 'REST_AGENDA') {
                    adicionarLinha(`<span style="color: #4da6ff;">📅 ${pacote.dados.length} jogos monitorados hoje.</span>`);
                }
            
            } catch (erro) {
                console.log("Erro ao processar dados", erro);
            }
        };

        socket.onclose = () => {
            adicionarLinha('<span style="color: #d29922;">⚠️ Conexão perdida. Tentando reconectar...</span>');
            setTimeout(conectarMotor, 3000);
        };
    }

    conectarMotor();
</script>

</body>
</html>
